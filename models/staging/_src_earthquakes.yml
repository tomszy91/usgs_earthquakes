sources:
  - name: raw
    tables:
      - name: raw_earthquakes
        columns:
          - name: event_id
            data_type: string
          - name: event_time
            data_type: timestamp
          - name: updated_at
            data_type: timestamp
          - name: magnitude
            data_type: float64
          - name: place
            data_type: string
          - name: longitude
            data_type: float64
          - name: latitude
            data_type: float64
          - name: depth_km
            data_type: float64
          - name: status
            data_type: string
          - name: ingested_at
            data_type: timestamp
          - name: raw_json
            data_type: string